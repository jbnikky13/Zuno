name: Flutter checks

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS host projects
        run: flutter create --platforms=android,ios --project-name zuno --org com.zuno .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget and model tests
        run: flutter test
