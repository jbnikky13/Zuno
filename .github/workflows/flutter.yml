name: Flutter checks

on:
  push:
    paths:
      - "app/**"
      - "docs/NATIVE_BOOTSTRAP.md"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app/**"
      - "docs/NATIVE_BOOTSTRAP.md"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native projects and configure BLE permissions
        run: bash tool/bootstrap_native.sh

      - name: Verify native BLE permission declarations
        run: |
          grep -q 'android.permission.BLUETOOTH_SCAN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.BLUETOOTH_ADVERTISE' android/app/src/main/AndroidManifest.xml
          grep -q 'NSBluetoothAlwaysUsageDescription' ios/Runner/Info.plist
          grep -q 'NSBluetoothPeripheralUsageDescription' ios/Runner/Info.plist

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget and model tests
        run: flutter test

  build-android-debug-apk:
    needs: flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native projects and configure BLE permissions
        run: bash tool/bootstrap_native.sh

      - name: Build debug APK for physical Android testing
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zuno-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
